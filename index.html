<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Verificación de Certificado | ABELDB Cybersecurity</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 35px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #111827;
    }

    .subtitle {
      margin-top: 8px;
      color: #6b7280;
      font-size: 15px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 25px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }

    .success {
      text-align: center;
      margin-bottom: 25px;
      padding: 15px;
      border-radius: 10px;
      background: #ecfdf5;
      color: #047857;
      font-weight: bold;
    }

    .error {
      text-align: center;
      padding: 20px;
      border-radius: 10px;
      background: #fef2f2;
      color: #b91c1c;
      font-weight: bold;
    }

    .certificate {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 20px;
    }

    .row {
      display: flex;
      border-bottom: 1px solid #e5e7eb;
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      width: 40%;
      background: #f9fafb;
      padding: 14px;
      font-weight: bold;
    }

    .value {
      width: 60%;
      padding: 14px;
      word-break: break-word;
    }

    .verified {
      display: inline-block;
      background: #dcfce7;
      color: #166534;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #6b7280;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px auto;
        padding: 10px;
      }

      .card {
        padding: 22px;
      }

      .row {
        display: block;
      }

      .label,
      .value {
        width: 100%;
      }

      .label {
        padding-bottom: 5px;
      }

      .value {
        padding-top: 5px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="header">
        <div class="logo">ABELDB Cybersecurity</div>
        <div class="subtitle">
          Sistema de verificación de certificados
        </div>
      </div>

      <h1>Verificación de Certificado</h1>

      <div id="resultado">
        <div class="loading">
          Verificando certificado...
        </div>
      </div>

      <div class="footer">
        ABELDB Cybersecurity<br>
        Documento electrónico de verificación
      </div>

    </div>

  </div>


  <script>

    // ==========================================
    // URL DE TU GOOGLE APPS SCRIPT
    // ==========================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwnGzpWKOtfmommd4o_b_gbxDml7psb8MaliVAZ7bOvn1v70JCewrJIDyIswLqff6dLyQ/exec";


    // ==========================================
    // OBTENER ID DEL CERTIFICADO
    // ==========================================

    const parametros = new URLSearchParams(window.location.search);

    const id = parametros.get("id");


    // ==========================================
    // ELEMENTO DONDE MOSTRAMOS EL RESULTADO
    // ==========================================

    const resultado = document.getElementById("resultado");


    // ==========================================
    // SI NO HAY ID
    // ==========================================

    if (!id) {

      resultado.innerHTML = `
        <div class="error">
          No se especificó un número de certificado.
        </div>
      `;

    } else {

      verificarCertificado(id);

    }


    // ==========================================
    // VERIFICAR CERTIFICADO
    // ==========================================

    async function verificarCertificado(id) {

      try {

        const url =
          API_URL + "?id=" + encodeURIComponent(id);

        const respuesta = await fetch(url);

        if (!respuesta.ok) {
          throw new Error("No se pudo conectar con el servidor.");
        }

        const datos = await respuesta.json();

        mostrarResultado(datos);

      } catch (error) {

        console.error(error);

        resultado.innerHTML = `
          <div class="error">
            No fue posible verificar el certificado.
            <br><br>
            Inténtalo nuevamente.
          </div>
        `;

      }

    }


    // ==========================================
    // MOSTRAR RESULTADO
    // ==========================================

    function mostrarResultado(datos) {

      // Si el Apps Script devuelve error

      if (
        datos.error ||
        datos.encontrado === false ||
        datos.valido === false
      ) {

        resultado.innerHTML = `
          <div class="error">
            Certificado no encontrado
            <br><br>
            Número:
            <strong>${escapar(datos.id || id)}</strong>
          </div>
        `;

        return;
      }


      // ==========================================
      // DATOS DEL CERTIFICADO
      // ==========================================

      const numero =
        datos.numeroCertificado ||
        datos.numero ||
        datos.id ||
        id;

      const nombre =
        datos.nombreCompleto ||
        datos.nombre ||
        "";

      const correo =
        datos.correo ||
        datos.email ||
        "";

      const curso =
        datos.curso ||
        "Linux Básico desde Cero";

      const duracion =
        datos.duracion ||
        "24 horas";

      const modalidad =
        datos.modalidad ||
        "Online";

      const fecha =
        datos.fechaFinalizacion ||
        datos.fecha ||
        "";

      const estado =
        datos.estado ||
        "Completado";


      // ==========================================
      // MOSTRAR CERTIFICADO
      // ==========================================

      resultado.innerHTML = `

        <div class="success">
          ✓ CERTIFICADO VERIFICADO
        </div>

        <div class="certificate">

          <div class="row">
            <div class="label">
              N.º Certificado
            </div>

            <div class="value">
              <strong>${escapar(numero)}</strong>
            </div>
          </div>


          <div class="row">
            <div class="label">
              Nombre completo
            </div>

            <div class="value">
              ${escapar(nombre)}
            </div>
          </div>


          <div class="row">
            <div class="label">
              Correo electrónico
            </div>

            <div class="value">
              ${escapar(correo)}
            </div>
          </div>


          <div class="row">
            <div class="label">
              Curso
            </div>

            <div class="value">
              ${escapar(curso)}
            </div>
          </div>


          <div class="row">
            <div class="label">
              Duración
            </div>

            <div class="value">
              ${escapar(duracion)}
            </div>
          </div>


          <div class="row">
            <div class="label">
              Modalidad
            </div>

            <div class="value">
              ${escapar(modalidad)}
            </div>
          </div>


          <div class="row">
            <div class="label">
              Fecha de finalización
            </div>

            <div class="value">
              ${escapar(fecha)}
            </div>
          </div>


          <div class="row">
            <div class="label">
              Estado
            </div>

            <div class="value">
              <span class="verified">
                ${escapar(estado)}
              </span>
            </div>
          </div>

        </div>

      `;

    }


    // ==========================================
    // SEGURIDAD
    // Evita insertar HTML directamente desde
    // los datos de Google Sheets
    // ==========================================

    function escapar(texto) {

      if (texto === null || texto === undefined) {
        return "";
      }

      return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

  </script>

</body>
</html>
