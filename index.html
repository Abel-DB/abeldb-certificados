<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ABELDB Cybersecurity | Verificación de Certificados</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f9fc;
            color: #10243e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            border: 1px solid #e3e8ef;
            padding: 60px;
            text-align: center;
        }

        .brand {
            margin-bottom: 50px;
        }

        .brand-name {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 8px;
            color: #10243e;
        }

        .brand-subtitle {
            margin-top: 12px;
            font-size: 13px;
            letter-spacing: 6px;
            color: #40536d;
        }

        .line {
            width: 70px;
            height: 3px;
            background: #5875ff;
            margin: 20px auto 0;
        }

        h1 {
            font-size: 32px;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        .description {
            color: #66758a;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        .search-box {
            display: flex;
            max-width: 600px;
            margin: 0 auto;
        }

        input {
            flex: 1;
            padding: 16px;
            border: 1px solid #ccd4df;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #5875ff;
        }

        button {
            padding: 16px 25px;
            border: none;
            background: #10243e;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1b3657;
        }

        .result {
            display: none;
            margin-top: 40px;
            padding: 30px;
            border: 1px solid #dfe5ec;
            text-align: left;
        }

        .valid {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .data {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .data-item span {
            display: block;
            color: #738198;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .data-item strong {
            font-size: 16px;
        }

        footer {
            margin-top: 45px;
            font-size: 12px;
            color: #8995a5;
        }

        .loading {
            color: #66758a;
        }

        .error {
            color: #9b2226;
        }

        @media (max-width: 600px) {

            .container {
                padding: 35px 20px;
            }

            .brand-name {
                font-size: 25px;
                letter-spacing: 5px;
            }

            h1 {
                font-size: 25px;
            }

            .search-box {
                flex-direction: column;
            }

            button {
                margin-top: 10px;
            }

            .data {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<main class="container">

    <header class="brand">

        <div class="brand-name">
            ABELDB
        </div>

        <div class="brand-subtitle">
            CYBERSECURITY
        </div>

        <div class="line"></div>

    </header>


    <h1>
        VERIFICACIÓN DE CERTIFICADOS
    </h1>


    <p class="description">
        Introduce el número de certificado para comprobar
        su autenticidad y los datos asociados.
    </p>


    <div class="search-box">

        <input
            type="text"
            id="certificateInput"
            placeholder="Ej. ABELDB-LNX-2026-0001"
            autocomplete="off"
        >

        <button onclick="verifyCertificate()">
            VERIFICAR
        </button>

    </div>


    <section
        class="result"
        id="result"
    ></section>


    <footer>
        ABELDB Cybersecurity · Sistema de verificación de certificados
    </footer>

</main>


<script>

    /*
     * URL DE NUESTRO APPS SCRIPT
     */
    const API_URL =
        "https://script.google.com/macros/s/AKfycbwnGzpWKOtfmommd4o_b_gbxDml7psb8MaliVAZ7bOvn1v70JCewrJIDyIswLqff6dLyQ/exec";


    /*
     * Escapa texto para evitar que datos externos
     * sean interpretados como HTML.
     */
    function escapeHTML(text) {

        return String(text ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /*
     * Muestra un mensaje dentro del resultado.
     */
    function showMessage(title, message, className = "") {

        const result =
            document.getElementById("result");

        result.style.display = "block";

        result.innerHTML = `
            <div class="valid ${className}">
                ${escapeHTML(title)}
            </div>

            <p>
                ${message}
            </p>
        `;

    }


    /*
     * Verifica un certificado consultando
     * directamente nuestro Apps Script.
     */
    async function verifyCertificate() {

        const input =
            document
                .getElementById("certificateInput")
                .value
                .trim()
                .toUpperCase();


        if (!input) {

            showMessage(
                "INTRODUCE UN NÚMERO DE CERTIFICADO",
                "Escribe el número de certificado para realizar la búsqueda."
            );

            return;
        }


        const result =
            document.getElementById("result");


        result.style.display = "block";


        result.innerHTML = `
            <div class="valid loading">
                VERIFICANDO...
            </div>

            <p>
                Consultando el registro de ABELDB.
            </p>
        `;


        try {

            const response =
                await fetch(
                    API_URL +
                    "?id=" +
                    encodeURIComponent(input)
                );


            if (!response.ok) {

                throw new Error(
                    "No se pudo conectar con Apps Script."
                );

            }


            const data =
                await response.json();


            /*
             * CERTIFICADO NO ENCONTRADO
             */
            if (!data.encontrado) {

                showMessage(
                    "CERTIFICADO NO ENCONTRADO",
                    `
                        No existe un certificado registrado
                        con el número:
                        <strong>${escapeHTML(input)}</strong>
                    `
                );

                return;
            }


            const certificate =
                data.certificado;


            /*
             * CERTIFICADO ENCONTRADO PERO TODAVÍA
             * NO ESTÁ VALIDADO.
             */
            if (
                String(certificate.estado)
                    .trim()
                    .toLowerCase() !== "válido"
            ) {

                showMessage(
                    "CERTIFICADO NO VÁLIDO",
                    `
                        El certificado
                        <strong>${escapeHTML(certificate.numero)}</strong>
                        se encuentra actualmente en estado:
                        <strong>${escapeHTML(certificate.estado)}</strong>.
                    `
                );

                return;
            }


            /*
             * CERTIFICADO VÁLIDO
             */
            result.innerHTML = `

                <div class="valid">
                    CERTIFICADO VÁLIDO
                </div>


                <div class="data">

                    <div class="data-item">

                        <span>
                            Participante
                        </span>

                        <strong>
                            ${escapeHTML(certificate.nombre)}
                        </strong>

                    </div>


                    <div class="data-item">

                        <span>
                            Curso
                        </span>

                        <strong>
                            ${escapeHTML(certificate.curso)}
                        </strong>

                    </div>


                    <div class="data-item">

                        <span>
                            Duración
                        </span>

                        <strong>
                            ${escapeHTML(certificate.duracion)}
                        </strong>

                    </div>


                    <div class="data-item">

                        <span>
                            Modalidad
                        </span>

                        <strong>
                            ${escapeHTML(certificate.modalidad)}
                        </strong>

                    </div>


                    <div class="data-item">

                        <span>
                            Fecha de finalización
                        </span>

                        <strong>
                            ${escapeHTML(certificate.fecha)}
                        </strong>

                    </div>


                    <div class="data-item">

                        <span>
                            N.º de certificado
                        </span>

                        <strong>
                            ${escapeHTML(certificate.numero)}
                        </strong>

                    </div>

                </div>
            `;


            result.style.display = "block";


        } catch (error) {

            console.error(error);


            showMessage(
                "ERROR DE VERIFICACIÓN",
                `
                    No fue posible consultar el registro
                    de certificados.
                    Inténtalo nuevamente.
                `,
                "error"
            );

        }

    }


    /*
     * Permite presionar ENTER en el campo
     * en lugar de pulsar VERIFICAR.
     */
    document
        .getElementById("certificateInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    verifyCertificate();

                }

            }
        );


    /*
     * Si la página recibe:
     *
     * ?id=ABELDB-LNX-2026-0002
     *
     * verifica automáticamente ese certificado.
     */
    window.addEventListener(
        "DOMContentLoaded",
        function() {

            const params =
                new URLSearchParams(
                    window.location.search
                );


            const certificateId =
                params.get("id");


            if (certificateId) {

                const input =
                    document.getElementById(
                        "certificateInput"
                    );


                input.value =
                    certificateId;


                verifyCertificate();

            }

        }
    );

</script>

</body>
</html>
