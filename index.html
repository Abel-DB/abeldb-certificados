<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ABELDB Cybersecurity | Verificación de Certificados</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f9fc;
            color: #10243e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            border: 1px solid #e3e8ef;
            padding: 60px;
        }

        .brand {
            text-align: center;
            margin-bottom: 45px;
        }

        .brand-name {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 8px;
            color: #10243e;
        }

        .brand-subtitle {
            margin-top: 12px;
            font-size: 13px;
            letter-spacing: 6px;
            color: #40536d;
        }

        .line {
            width: 70px;
            height: 3px;
            background: #5875ff;
            margin: 20px auto 0;
        }

        h1 {
            text-align: center;
            font-size: 30px;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .description {
            text-align: center;
            color: #66758a;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        .search-box {
            display: flex;
            max-width: 600px;
            margin: 0 auto;
        }

        input {
            flex: 1;
            padding: 16px;
            border: 1px solid #ccd4df;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #5875ff;
        }

        button {
            padding: 16px 25px;
            border: none;
            background: #10243e;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1b3657;
        }

        .result {
            display: none;
            margin-top: 40px;
            padding: 30px;
            border: 1px solid #dfe5ec;
        }

        .status {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 25px;
            text-align: center;
        }

        .status.valid {
            color: #176b3a;
        }

        .status.invalid {
            color: #a52828;
        }

        .data {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .data-item span {
            display: block;
            color: #738198;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .data-item strong {
            font-size: 16px;
        }

        .loading {
            text-align: center;
            color: #66758a;
        }

        footer {
            margin-top: 45px;
            font-size: 12px;
            color: #8995a5;
            text-align: center;
        }

        @media (max-width: 600px) {

            .container {
                padding: 35px 20px;
            }

            .brand-name {
                font-size: 25px;
                letter-spacing: 5px;
            }

            h1 {
                font-size: 24px;
            }

            .search-box {
                flex-direction: column;
            }

            button {
                margin-top: 10px;
            }

            .data {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<main class="container">

    <header class="brand">

        <div class="brand-name">
            ABELDB
        </div>

        <div class="brand-subtitle">
            CYBERSECURITY
        </div>

        <div class="line"></div>

    </header>


    <h1>
        VERIFICACIÓN DE CERTIFICADOS
    </h1>


    <p class="description">
        Introduce el número de certificado para comprobar
        su autenticidad y los datos asociados.
    </p>


    <div class="search-box">

        <input
            type="text"
            id="certificateInput"
            placeholder="Ej. ABELDB-LNX-2026-0002"
        >

        <button onclick="verifyCertificate()">
            VERIFICAR
        </button>

    </div>


    <section
        class="result"
        id="result">
    </section>


    <footer>
        ABELDB Cybersecurity · Sistema de verificación de certificados
    </footer>

</main>


<script>

    const API_URL =
        "https://script.google.com/macros/s/AKfycbwnGzpWKOtfmommd4o_b_gbxDml7psb8MaliVAZ7bOvn1v70JCewrJIDyIswLqff6dLyQ/exec";


    async function verifyCertificate() {

        const input =
            document
                .getElementById("certificateInput")
                .value
                .trim()
                .toUpperCase();


        const result =
            document.getElementById("result");


        if (!input) {

            result.style.display = "block";

            result.innerHTML = `
                <div class="status invalid">
                    INTRODUCE UN NÚMERO DE CERTIFICADO
                </div>
            `;

            return;

        }


        result.style.display = "block";

        result.innerHTML = `
            <div class="loading">
                Verificando certificado...
            </div>
        `;


        try {

            const response =
                await fetch(
                    API_URL +
                    "?id=" +
                    encodeURIComponent(input)
                );


            const data =
                await response.json();


            if (!data.encontrado) {

                result.innerHTML = `
                    <div class="status invalid">
                        CERTIFICADO NO ENCONTRADO
                    </div>

                    <p style="text-align:center;">
                        No existe un certificado registrado
                        con el número:
                        <strong>${escapeHTML(input)}</strong>
                    </p>
                `;

                return;

            }


            const certificado =
                data.certificado;


            if (
                String(certificado.estado)
                    .trim()
                    .toLowerCase() !== "válido"
            ) {

                result.innerHTML = `
                    <div class="status invalid">
                        CERTIFICADO NO VÁLIDO
                    </div>

                    <p style="text-align:center;">
                        El certificado se encuentra en estado:
                        <strong>
                            ${escapeHTML(certificado.estado)}
                        </strong>
                    </p>
                `;

                return;

            }


            result.innerHTML = `

                <div class="status valid">
                    CERTIFICADO VÁLIDO
                </div>


                <div class="data">

                    <div class="data-item">
                        <span>Participante</span>
                        <strong>
                            ${escapeHTML(certificado.nombre)}
                        </strong>
                    </div>


                    <div class="data-item">
                        <span>Curso</span>
                        <strong>
                            ${escapeHTML(certificado.curso)}
                        </strong>
                    </div>


                    <div class="data-item">
                        <span>Duración</span>
                        <strong>
                            ${escapeHTML(certificado.duracion)}
                        </strong>
                    </div>


                    <div class="data-item">
                        <span>Modalidad</span>
                        <strong>
                            ${escapeHTML(certificado.modalidad)}
                        </strong>
                    </div>


                    <div class="data-item">
                        <span>Fecha de finalización</span>
                        <strong>
                            ${escapeHTML(certificado.fecha || "No registrada")}
                        </strong>
                    </div>


                    <div class="data-item">
                        <span>N.º de certificado</span>
                        <strong>
                            ${escapeHTML(certificado.numero)}
                        </strong>
                    </div>

                </div>

            `;


        } catch (error) {

            console.error(error);

            result.innerHTML = `

                <div class="status invalid">
                    ERROR DE VERIFICACIÓN
                </div>

                <p style="text-align:center;">
                    No fue posible consultar el sistema
                    de verificación.
                </p>

            `;

        }

    }


    function escapeHTML(text) {

        return String(text ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    document
        .getElementById("certificateInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    verifyCertificate();
                }

            }
        );


    window.addEventListener(
        "DOMContentLoaded",
        function() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const certificateId =
                params.get("id");


            if (certificateId) {

                document
                    .getElementById("certificateInput")
                    .value = certificateId;

                verifyCertificate();

            }

        }
    );

</script>

</body>
</html>
